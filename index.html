<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>شمارشگر</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1918">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;900&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  :root{
    --bg: #1B1918;
    --bg-soft: #242120;
    --ash: #8A8580;
    --paper: #F2EEE7;
    --line: #35312F;
    --accent: #C1502E;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--paper);
    font-family: 'Vazirmatn', sans-serif;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    padding-bottom: 74px;
  }

  header { padding: 24px 24px 6px; text-align: center; }
  header .date { color: var(--ash); font-size: 13px; letter-spacing: 0.5px; }

  .view { display: none; flex: 1; flex-direction: column; }
  .view.active { display: flex; }

  /* ---------- HOME ---------- */
  #view-home { align-items: center; padding: 10px 24px 20px; }

  .message-card {
    width: 100%;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 16px;
    font-size: 13.5px;
    text-align: center;
    line-height: 1.7;
    margin-bottom: 26px;
  }

  main.center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    width: 100%;
  }

  .count-label { color: var(--ash); font-size: 14px; margin-bottom: 6px; }
  .count-number {
    font-size: 88px;
    font-weight: 900;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    margin-bottom: 34px;
    transition: transform 0.15s ease;
  }
  .count-number.pulse { transform: scale(1.08); }

  /* ---- cigarette button ---- */
  .cig-wrap {
    position: relative;
    width: 220px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cig-btn { background: none; border: none; cursor: pointer; padding: 0; width: 100%; height: 100%; position: relative; }
  .cig-rotate {
    position: absolute;
    top: 50%; left: 50%;
    width: 176px; height: 34px;
    transform: translate(-50%, -50%) rotate(-7deg);
  }
  .cig-body {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #F6F2E9 0%, #E2DCCC 100%);
    border-radius: 17px;
    box-shadow: 0 5px 12px rgba(0,0,0,0.4);
  }
  .cig-body::after{
    content:'';
    position:absolute; left:26px; top:0; bottom:0; width:2px;
    background: rgba(0,0,0,0.06);
  }
  .cig-filter {
    position: absolute; right: 0; top: 0; bottom: 0; width: 42px;
    background: linear-gradient(180deg, #CB8E60, #A76B3E);
    border-radius: 0 17px 17px 0;
  }
  .cig-tip {
    position: absolute; left: -15px; top: 50%;
    width: 38px; height: 38px;
    border-radius: 50%;
    transform: translateY(-50%);
    transition: background 0.4s ease, box-shadow 0.4s ease;
  }
  .smoke-wisp {
    position: absolute;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: rgba(220,218,212,0.5);
    filter: blur(3px);
    left: -20px; top: -8px;
    animation: smokeRise 4.2s ease-in infinite;
    opacity: 0;
  }
  .smoke-wisp:nth-child(2){ left: -14px; top: -4px; animation-delay: 1.4s; }
  .smoke-wisp:nth-child(3){ left: -24px; top: -2px; animation-delay: 2.8s; }
  @keyframes smokeRise {
    0% { transform: translate(0,0) scale(0.6); opacity: 0; }
    18% { opacity: 0.55; }
    100% { transform: translate(-14px,-58px) scale(1.5); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .smoke-wisp { animation: none; opacity: 0; }
  }

  .tap-caption { margin-top: 18px; font-size: 12.5px; color: var(--ash); }

  .undo-btn {
    margin-top: 16px;
    background: none;
    border: 1px solid var(--line);
    color: var(--ash);
    font-family: inherit;
    font-size: 13px;
    padding: 8px 18px;
    border-radius: 999px;
    cursor: pointer;
  }

  .cost-today { margin-top: 16px; font-size: 13px; color: var(--ash); }
  .cost-today b { color: var(--paper); font-weight: 700; }

  /* ---------- STATS ---------- */
  #view-stats { padding: 10px 24px 30px; overflow-y: auto; }
  #view-stats h1 { font-size: 18px; font-weight: 700; margin-bottom: 18px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 26px; }
  .stat-box { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .stat-box .label { font-size: 12px; color: var(--ash); margin-bottom: 6px; }
  .stat-box .value { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--ash); margin-bottom: 12px; letter-spacing: 0.4px; }
  .chart-wrap { display: flex; align-items: flex-end; gap: 5px; height: 120px; margin-bottom: 8px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar { width: 100%; max-width: 18px; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 3px; }
  .bar-day-labels { display: flex; gap: 5px; margin-bottom: 24px; }
  .bar-day-labels span { flex: 1; text-align: center; font-size: 10px; color: var(--ash); }
  .day-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .day-row:last-child { border-bottom: none; }
  .day-row .day-label { font-size: 14px; min-width: 78px; }
  .day-row .day-total { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .empty-note { color: var(--ash); font-size: 13px; text-align: center; padding: 16px 0; }

  /* ---------- COST ---------- */
  #view-cost { padding: 10px 24px 30px; }
  #view-cost h1 { font-size: 18px; font-weight: 700; margin-bottom: 18px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--ash); margin-bottom: 8px; }
  .field input {
    width: 100%; background: var(--bg-soft); border: 1px solid var(--line);
    border-radius: 12px; padding: 13px 14px; color: var(--paper);
    font-family: inherit; font-size: 16px; font-variant-numeric: tabular-nums;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .save-btn {
    width: 100%; background: var(--accent); border: none; color: var(--paper);
    font-family: inherit; font-weight: 700; font-size: 15px; padding: 14px;
    border-radius: 12px; cursor: pointer; margin-top: 4px;
  }
  .save-btn:active { opacity: 0.85; }
  .saved-note { text-align: center; font-size: 12px; color: var(--ash); margin-top: 10px; height: 16px; }
  .cost-summary { margin-top: 26px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .cost-summary .row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; }
  .cost-summary .row + .row { border-top: 1px solid var(--line); }
  .cost-summary .row b { font-variant-numeric: tabular-nums; }

  /* ---------- NAV ---------- */
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto;
    display: flex; background: var(--bg-soft); border-top: 1px solid var(--line);
  }
  nav.tabs button { flex: 1; background: none; border: none; color: var(--ash); font-family: inherit; font-size: 12.5px; padding: 14px 0 12px; cursor: pointer; }
  nav.tabs button.active { color: var(--paper); font-weight: 700; }

  /* ---------- MODAL ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; z-index: 50;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-card {
    width: 100%; max-width: 340px; background: var(--bg-soft);
    border: 1px solid var(--line); border-radius: 18px; padding: 22px;
  }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; text-align: center; }
  .modal-body { font-size: 14px; color: var(--paper); line-height: 1.8; text-align: center; margin-bottom: 18px; }
  .modal-input {
    width: 100%; background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; color: var(--paper);
    font-family: inherit; font-size: 16px; margin-bottom: 4px;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 10px; }
  .modal-btn { flex: 1; border: none; border-radius: 12px; padding: 12px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .modal-btn.primary { background: var(--accent); color: var(--paper); }
  .modal-btn.secondary { background: none; border: 1px solid var(--line); color: var(--ash); }
</style>
</head>
<body>

<header><div class="date" id="today-date"></div></header>

<div class="view active" id="view-home">
  <div class="message-card" id="daily-message"></div>
  <main class="center">
    <div class="count-label">امروز</div>
    <div class="count-number" id="count-number">۰</div>

    <div class="cig-wrap">
      <button class="cig-btn" id="tap-btn" aria-label="یک نخ ثبت شد">
        <div class="cig-rotate">
          <div class="cig-body"></div>
          <div class="cig-filter"></div>
          <div class="cig-tip" id="cig-tip"></div>
          <div class="smoke-wisp"></div>
          <div class="smoke-wisp"></div>
          <div class="smoke-wisp"></div>
        </div>
      </button>
    </div>
    <div class="tap-caption">بزن رو نخ سیگار برای ثبت</div>

    <button class="undo-btn" id="undo-btn">اصلاح آخرین ثبت</button>
    <div class="cost-today" id="cost-today"></div>
  </main>
</div>

<div class="view" id="view-stats">
  <h1>آمار</h1>
  <div class="stat-grid" id="stat-grid"></div>
  <div class="section-title">۱۴ روز اخیر</div>
  <div class="chart-wrap" id="chart-wrap"></div>
  <div class="bar-day-labels" id="chart-labels"></div>
  <div class="section-title">تاریخچه روزانه</div>
  <div id="history-list"></div>
</div>

<div class="view" id="view-cost">
  <h1>هزینه</h1>
  <div class="field">
    <label>قیمت هر پاکت (تومان)</label>
    <input type="number" id="pack-price" inputmode="numeric" placeholder="مثلاً ۱۵۰۰۰۰">
  </div>
  <div class="field">
    <label>تعداد نخ در هر پاکت</label>
    <input type="number" id="cigs-per-pack" inputmode="numeric" placeholder="۲۰">
  </div>
  <button class="save-btn" id="save-price-btn">ذخیره</button>
  <div class="saved-note" id="saved-note"></div>

  <div class="cost-summary">
    <div class="row"><span>قیمت هر نخ</span><b id="price-per-cig">—</b></div>
    <div class="row"><span>هزینه امروز</span><b id="cost-summary-today">—</b></div>
    <div class="row"><span>هزینه این ماه</span><b id="cost-summary-month">—</b></div>
    <div class="row"><span>هزینه کل (از شروع ثبت)</span><b id="cost-summary-total">—</b></div>
  </div>
</div>

<nav class="tabs">
  <button class="tab-btn active" data-view="home">امروز</button>
  <button class="tab-btn" data-view="stats">آمار</button>
  <button class="tab-btn" data-view="cost">هزینه</button>
</nav>

<div class="modal-overlay" id="pack-modal" hidden>
  <div class="modal-card">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script>
const LOG_KEY = 'smoke-log';
const SETTINGS_KEY = 'smoke-settings';
const faDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function toFa(n){ return String(n).split('').map(d => faDigits[d] ?? d).join(''); }
function faNum(n){ return new Intl.NumberFormat('fa-IR').format(Math.round(n)); }

const MESSAGES = [
  'امروز رو با انرژی شروع کن، هر قدم کوچیک هم حساب میشه.',
  'یه نفس عمیق بکش، امروز روز خوبیه برای تلاش دوباره.',
  'بدنت رو دوست داشته باش، بهش فرصت بده که قوی‌تر بشه.',
  'هر روز یه شروع تازه‌ست، از همین لحظه شروع کن.',
  'کوچیک شروع کن ولی پیوسته ادامه بده.',
  'امروز رو با یه لبخند شروع کن، انرژی مثبت میاره.',
  'به خودت افتخار کن که داری مسیرت رو دنبال می‌کنی.',
  'هر لحظه یه فرصت جدیده برای انتخاب بهتر.',
  'آب کافی بخور و کمی حرکت کن، حالت بهتر میشه.',
  'صبور باش با خودت، تغییر واقعی زمان می‌بره.',
  'امروز رو قدم به قدم جلو برو، عجله نکن.',
  'نفس بکش، آروم باش، امروز رو خوب بگذرون.'
];

function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function dayOfYear(d){ const start = new Date(d.getFullYear(), 0, 0); return Math.floor((d - start) / 86400000); }
function formatDateLabel(key){
  const [y,m,d] = key.split('-').map(Number);
  const date = new Date(y, m-1, d);
  const weekday = new Intl.DateTimeFormat('fa-IR', { weekday: 'long' }).format(date);
  const day = new Intl.DateTimeFormat('fa-IR', { day: 'numeric', month: 'long' }).format(date);
  return { weekday, day };
}
function keyToDate(key){ const [y,m,d] = key.split('-').map(Number); return new Date(y, m-1, d); }
function daysAgoKey(n){
  const d = new Date(); d.setDate(d.getDate() - n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

let log = {};
let settings = { packPrice: 0, cigsPerPack: 20, packPromptCount: 0 };

/* ذخیره‌سازی محلی روی خود گوشی (بدون نیاز به اینترنت) */
async function loadAll(){
  try {
    const raw = localStorage.getItem(LOG_KEY);
    log = raw ? JSON.parse(raw) : {};
  } catch(e) { log = {}; }
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) settings = Object.assign({ packPrice:0, cigsPerPack:20, packPromptCount:0 }, JSON.parse(raw));
  } catch(e) { /* keep defaults */ }
}
async function saveLog(){
  try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); }
  catch(e) { console.error('ذخیره‌سازی ناموفق بود', e); }
}
async function saveSettings(){
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
  catch(e) { console.error('ذخیره‌سازی تنظیمات ناموفق بود', e); }
}

/* ---- color interpolation for the cigarette tip ---- */
const BLUE = [42, 99, 150];
const RED  = [193, 80, 46];
const BLACK = [18, 17, 16];
function lerp(a,b,t){ return Math.round(a + (b-a)*t); }
function tipColor(count){
  if (count >= 20) return BLACK;
  const t = Math.min(count, 19) / 19;
  return [ lerp(BLUE[0],RED[0],t), lerp(BLUE[1],RED[1],t), lerp(BLUE[2],RED[2],t) ];
}
function rgbStr(c){ return `rgb(${c[0]},${c[1]},${c[2]})`; }
function applyTipColor(count){
  const c = tipColor(count);
  const tip = document.getElementById('cig-tip');
  const light = c.map(v => Math.min(255, v+45));
  tip.style.background = `radial-gradient(circle at 35% 30%, ${rgbStr(light)} 0%, ${rgbStr(c)} 75%)`;
  tip.style.boxShadow = `0 0 0 1px rgba(${c[0]},${c[1]},${c[2]},0.35), 0 0 16px 3px rgba(${c[0]},${c[1]},${c[2]},0.6)`;
}

/* ---- rendering: home ---- */
function renderMessage(){
  const idx = dayOfYear(new Date()) % MESSAGES.length;
  document.getElementById('daily-message').textContent = MESSAGES[idx];
}
function pricePerCig(){
  const cigs = settings.cigsPerPack > 0 ? settings.cigsPerPack : 20;
  return settings.packPrice > 0 ? settings.packPrice / cigs : 0;
}
function renderHome(){
  const key = todayKey();
  const count = log[key] || 0;
  document.getElementById('count-number').textContent = toFa(count);
  applyTipColor(count);
  const { weekday, day } = formatDateLabel(key);
  document.getElementById('today-date').textContent = weekday + '، ' + day;

  const ppc = pricePerCig();
  const costEl = document.getElementById('cost-today');
  costEl.innerHTML = ppc > 0 ? `هزینه امروز: <b>${faNum(count*ppc)} تومان</b>` : '';
}

/* ---- rendering: stats ---- */
function renderStats(){
  const keys = Object.keys(log).filter(k => (log[k]||0) > 0);
  const totalAll = keys.reduce((s,k) => s + log[k], 0);
  const daysTracked = keys.length;
  const avg = daysTracked > 0 ? totalAll / daysTracked : 0;
  let weekTotal = 0, monthTotal = 0;
  for (let i=0; i<7; i++) weekTotal += log[daysAgoKey(i)] || 0;
  for (let i=0; i<30; i++) monthTotal += log[daysAgoKey(i)] || 0;

  document.getElementById('stat-grid').innerHTML = `
    <div class="stat-box"><div class="label">جمع کل</div><div class="value">${toFa(totalAll)}</div></div>
    <div class="stat-box"><div class="label">میانگین روزانه</div><div class="value">${toFa(Math.round(avg*10)/10)}</div></div>
    <div class="stat-box"><div class="label">این هفته</div><div class="value">${toFa(weekTotal)}</div></div>
    <div class="stat-box"><div class="label">این ماه</div><div class="value">${toFa(monthTotal)}</div></div>
  `;

  const last14 = [];
  for (let i=13; i>=0; i--) last14.push(daysAgoKey(i));
  const max = Math.max(1, ...last14.map(k => log[k] || 0));
  document.getElementById('chart-wrap').innerHTML = last14.map(k => {
    const v = log[k] || 0;
    const h = Math.max(3, Math.round((v/max)*100));
    return `<div class="bar-col"><div class="bar" style="height:${h}%"></div></div>`;
  }).join('');
  document.getElementById('chart-labels').innerHTML = last14.map(k => {
    const d = keyToDate(k);
    return `<span>${toFa(d.getDate())}</span>`;
  }).join('');

  const todK = todayKey();
  const histKeys = Object.keys(log).filter(k => k !== todK && (log[k]||0) > 0).sort().reverse();
  const listEl = document.getElementById('history-list');
  listEl.innerHTML = histKeys.length === 0
    ? '<div class="empty-note">هنوز روز کاملی ثبت نشده</div>'
    : histKeys.slice(0,60).map(k => {
        const { weekday, day } = formatDateLabel(k);
        return `<div class="day-row">
          <div class="day-label">${weekday}<br><span style="color:var(--ash);font-size:12px">${day}</span></div>
          <div class="day-total">${toFa(log[k])}</div>
        </div>`;
      }).join('');
}

/* ---- rendering: cost ---- */
function renderCost(){
  document.getElementById('pack-price').value = settings.packPrice || '';
  document.getElementById('cigs-per-pack').value = settings.cigsPerPack || 20;
  const ppc = pricePerCig();
  document.getElementById('price-per-cig').textContent = ppc > 0 ? faNum(ppc) + ' تومان' : '—';
  const key = todayKey();
  const todayCount = log[key] || 0;
  document.getElementById('cost-summary-today').textContent = ppc > 0 ? faNum(todayCount*ppc) + ' تومان' : '—';
  let monthTotal = 0;
  for (let i=0; i<30; i++) monthTotal += log[daysAgoKey(i)] || 0;
  document.getElementById('cost-summary-month').textContent = ppc > 0 ? faNum(monthTotal*ppc) + ' تومان' : '—';
  const allTotal = Object.values(log).reduce((s,v) => s+v, 0);
  document.getElementById('cost-summary-total').textContent = ppc > 0 ? faNum(allTotal*ppc) + ' تومان' : '—';
}

function renderAll(){ renderHome(); renderStats(); renderCost(); }

/* ---- pack-completion modal ---- */
function openPackModal(){
  const title = document.getElementById('modal-title');
  const body = document.getElementById('modal-body');
  const actions = document.getElementById('modal-actions');
  title.textContent = 'یه پاکت تموم شد';
  if (settings.packPrice > 0){
    body.innerHTML = `قیمتش <b>${faNum(settings.packPrice)} تومان</b> بود، همینه؟`;
    actions.innerHTML = `
      <button class="modal-btn secondary" id="modal-no">نه، عوض شده</button>
      <button class="modal-btn primary" id="modal-yes">بله، همینه</button>
    `;
    document.getElementById('modal-yes').onclick = closePackModal;
    document.getElementById('modal-no').onclick = () => showPriceInput(body, actions);
  } else {
    showPriceInput(body, actions);
  }
  document.getElementById('pack-modal').hidden = false;
}
function showPriceInput(body, actions){
  body.innerHTML = `<div style="margin-bottom:10px">قیمت این پاکت چند بود؟</div>
    <input type="number" id="modal-price-input" inputmode="numeric" placeholder="قیمت پاکت (تومان)" class="modal-input" value="${settings.packPrice||''}">`;
  actions.innerHTML = `<button class="modal-btn primary" id="modal-save" style="width:100%">ذخیره</button>`;
  document.getElementById('modal-save').onclick = async () => {
    const v = parseFloat(document.getElementById('modal-price-input').value) || 0;
    settings.packPrice = v;
    await saveSettings();
    renderAll();
    closePackModal();
  };
}
function closePackModal(){ document.getElementById('pack-modal').hidden = true; }

/* ---- interactions ---- */
function spawnParticles(anchorEl, color){
  const rect = anchorEl.getBoundingClientRect();
  for (let i=0; i<6; i++){
    const p = document.createElement('div');
    p.style.position = 'fixed';
    p.style.pointerEvents = 'none';
    p.style.borderRadius = '50%';
    const size = 3 + Math.random()*4;
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.background = rgbStr(color);
    p.style.left = (rect.left + rect.width/2) + 'px';
    p.style.top = (rect.top + rect.height/2) + 'px';
    p.style.zIndex = 40;
    document.body.appendChild(p);
    const angle = Math.random()*Math.PI*2;
    const dist = 36 + Math.random()*46;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist - 26;
    p.animate([
      { transform: 'translate(0,0)', opacity: 0.9 },
      { transform: `translate(${dx}px, ${dy}px)`, opacity: 0 }
    ], { duration: 700 + Math.random()*300, easing: 'ease-out' });
    setTimeout(() => p.remove(), 1100);
  }
}

async function addOne(){
  const key = todayKey();
  log[key] = (log[key] || 0) + 1;
  renderAll();
  const numEl = document.getElementById('count-number');
  numEl.classList.add('pulse');
  setTimeout(() => numEl.classList.remove('pulse'), 150);
  spawnParticles(document.getElementById('cig-tip'), tipColor(log[key]));
  await saveLog();

  const total = Object.values(log).reduce((s,v) => s+v, 0);
  const cpp = settings.cigsPerPack || 20;
  const packsCompleted = Math.floor(total / cpp);
  if (packsCompleted > (settings.packPromptCount || 0)){
    settings.packPromptCount = packsCompleted;
    await saveSettings();
    openPackModal();
  }
}
async function undoOne(){
  const key = todayKey();
  if ((log[key] || 0) > 0){
    log[key] -= 1;
    if (log[key] === 0) delete log[key];
    renderAll();
    await saveLog();
  }
}
async function savePrice(){
  const pp = parseFloat(document.getElementById('pack-price').value) || 0;
  const cpp = parseInt(document.getElementById('cigs-per-pack').value) || 20;
  settings.packPrice = pp;
  settings.cigsPerPack = cpp;
  await saveSettings();
  renderHome(); renderCost();
  const note = document.getElementById('saved-note');
  note.textContent = 'ذخیره شد';
  setTimeout(() => note.textContent = '', 1800);
}

function switchView(view){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
}

document.getElementById('tap-btn').addEventListener('click', addOne);
document.getElementById('undo-btn').addEventListener('click', undoOne);
document.getElementById('save-price-btn').addEventListener('click', savePrice);
document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));

(async function init(){
  await loadAll();
  renderMessage();
  renderAll();
  setInterval(renderAll, 60000);
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
